# Production overlay. Use together with the base file:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
# Needs Docker Compose >= 2.24 (for !reset). Postgres, the backend and the frontend are no longer published on the
# host; only Caddy (80/443, automatic HTTPS) and the MQTT broker (1883, for the devices) are reachable from outside.
services:
  postgres:
    ports: !reset []

  backend:
    ports: !reset []

  frontend:
    ports: !reset []

  caddy:
    image: caddy:2
    container_name: smarthome-caddy
    depends_on:
      frontend:
        condition: service_healthy
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env (e.g. smarthome.example.com)}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
