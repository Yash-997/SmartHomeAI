spring.application.name=smarthome-backend
server.port=${SERVER_PORT:8080}

# Load secrets from the project-root .env when started from backend/ (optional; real env vars also work).
spring.config.import=optional:file:../.env[.properties]

spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:smarthome}
spring.datasource.username=${POSTGRES_USER:smarthome}
spring.datasource.password=${POSTGRES_PASSWORD}

# Schema is owned by Flyway migrations (src/main/resources/db/migration); Hibernate only checks it matches.
# db/vendor/{vendor} holds the few database-specific scripts (pgvector on PostgreSQL).
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration,classpath:db/vendor/{vendor}
# Databases created by Chunk 2 (via ddl-auto) have tables but no Flyway history: baseline at 0, then run V1 (idempotent) onward.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# No default: the app refuses to start without JWT_SECRET (min 32 chars).
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:60}

# Comma-separated list of allowed browser origins.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Device pairing
app.pairing.code-ttl-minutes=10

# MQTT (Mosquitto). Credentials come from .env; there are no defaults for passwords.
app.mqtt.enabled=${MQTT_ENABLED:true}
app.mqtt.host=${MQTT_HOST:localhost}
app.mqtt.port=${MQTT_PORT:1883}
app.mqtt.admin-username=${MQTT_ADMIN_USER:smarthome-admin}
app.mqtt.admin-password=${MQTT_ADMIN_PASSWORD:}
app.mqtt.backend-username=${MQTT_BACKEND_USER:smarthome-backend}
app.mqtt.backend-password=${MQTT_BACKEND_PASSWORD:}

# Remote commands: how long a command stays valid, and how long after expiry we wait for an acknowledgement
# before calling the outcome UNKNOWN.
app.commands.ttl-seconds=${COMMAND_TTL_SECONDS:30}
app.commands.unknown-grace-seconds=10
app.commands.sweep-ms=2000

# Automation engine (all optional; defaults are in AutomationProperties)
app.automation.schedule-tick-ms=15000
app.automation.schedule-catchup-seconds=300
app.automation.min-cooldown-seconds=5
app.automation.default-cooldown-seconds=60
app.automation.max-rules-per-user=50
app.automation.max-commands-per-device-per-minute=6

# ML features (all optional; defaults are in MlProperties). Training and scans run on a background worker,
# never per telemetry message.
app.ml.anomaly.scan-ms=60000
app.ml.training.auto-check-ms=3600000

# Security modes: how often devices that went offline while armed are looked for (ms).
app.security.sweep-ms=30000
# System status: a sensor with no value for this long counts as silent.
app.health.sensor-stale-seconds=300

# AI assistant (RAG chat). All optional: with LLM_PROVIDER unset the assistant still retrieves from your data and
# says that no language model is configured. Keys come from the environment / .env and are never logged.
#   LLM_PROVIDER=openai    + LLM_BASE_URL (OpenAI-compatible, e.g. http://localhost:11434/v1 for Ollama) + LLM_MODEL [+ LLM_API_KEY]
#   LLM_PROVIDER=anthropic + LLM_API_KEY [+ LLM_MODEL]
app.assistant.llm.provider=${LLM_PROVIDER:none}
app.assistant.llm.base-url=${LLM_BASE_URL:}
app.assistant.llm.api-key=${LLM_API_KEY:}
app.assistant.llm.model=${LLM_MODEL:}
app.assistant.llm.timeout-seconds=${LLM_TIMEOUT_SECONDS:30}
app.assistant.embedding.provider=${EMBEDDING_PROVIDER:local}
app.assistant.embedding.base-url=${EMBEDDING_BASE_URL:}
app.assistant.embedding.api-key=${EMBEDDING_API_KEY:}
app.assistant.embedding.model=${EMBEDDING_MODEL:}

# A device is shown as online only if it was heard from within this many seconds (firmware publishes every ~30s).
app.telemetry.stale-after-seconds=${TELEMETRY_STALE_AFTER_SECONDS:90}
