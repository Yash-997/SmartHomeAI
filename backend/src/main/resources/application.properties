```properties
spring.application.name=smarthome-backend
server.port=${SERVER_PORT:8080}

# Load project-root .env when running from backend/
spring.config.import=optional:file:../.env[.properties]

# PostgreSQL
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:smarthome}
spring.datasource.username=${POSTGRES_USER:smarthome}
spring.datasource.password=${POSTGRES_PASSWORD}

# Flyway and Hibernate
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration,classpath:db/vendor/{vendor}
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# JWT Authentication
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:60}

# CORS
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Device pairing
app.pairing.code-ttl-minutes=10

# MQTT
app.mqtt.enabled=${MQTT_ENABLED:true}
app.mqtt.host=${MQTT_HOST:localhost}
app.mqtt.port=${MQTT_PORT:1883}
app.mqtt.admin-username=${MQTT_ADMIN_USER:smarthome-admin}
app.mqtt.admin-password=${MQTT_ADMIN_PASSWORD:}
app.mqtt.backend-username=${MQTT_BACKEND_USER:smarthome-backend}
app.mqtt.backend-password=${MQTT_BACKEND_PASSWORD:}

# Remote commands
app.commands.ttl-seconds=${COMMAND_TTL_SECONDS:30}
app.commands.unknown-grace-seconds=10
app.commands.sweep-ms=2000

# Automation
app.automation.schedule-tick-ms=15000
app.automation.schedule-catchup-seconds=300
app.automation.min-cooldown-seconds=5
app.automation.default-cooldown-seconds=60
app.automation.max-rules-per-user=50
app.automation.max-commands-per-device-per-minute=6

# Machine learning
app.ml.anomaly.scan-ms=60000
app.ml.training.auto-check-ms=3600000
# Local time for learning daily routines and for automatic training (IANA zone name).
app.ml.default-time-zone=${ML_TIME_ZONE:Asia/Kolkata}
# How often the connectivity history (online/offline changes) is updated.
app.history.status-sweep-ms=60000

# Security
app.security.sweep-ms=30000

# Sensor health
app.health.sensor-stale-seconds=300
app.telemetry.stale-after-seconds=${TELEMETRY_STALE_AFTER_SECONDS:90}

# AI Assistant - multi-provider LLM. The primary (LLM_PRIMARY_PROVIDER, else LLM_PROVIDER) is asked first; on 429/5xx/timeout/
# network errors one attempt goes to LLM_FALLBACK_PROVIDER. A provider without an API key is skipped. none = no language model.
app.assistant.llm.provider=${LLM_PROVIDER:gemini}
app.assistant.llm.primary-provider=${LLM_PRIMARY_PROVIDER:${LLM_PROVIDER:gemini}}
app.assistant.llm.fallback-provider=${LLM_FALLBACK_PROVIDER:groq}
app.assistant.llm.timeout-seconds=${LLM_TIMEOUT_SECONDS:30}
app.assistant.llm.failover-cooldown-seconds=${LLM_FAILOVER_COOLDOWN_SECONDS:60}
# Only for LLM_PROVIDER=openai / anthropic:
app.assistant.llm.base-url=${LLM_BASE_URL:}
app.assistant.llm.api-key=${LLM_API_KEY:}
app.assistant.llm.model=${LLM_MODEL:}

# Google Gemini (primary)
app.assistant.llm.gemini.api-key=${GEMINI_API_KEY:}
app.assistant.llm.gemini.model=${GEMINI_MODEL:gemini-3-flash-preview}
app.assistant.llm.gemini.thinking-level=${GEMINI_THINKING_LEVEL:low}

# Groq (fallback)
app.assistant.llm.groq.api-key=${GROQ_API_KEY:}
app.assistant.llm.groq.model=${GROQ_MODEL:openai/gpt-oss-120b}

# Embeddings
app.assistant.embedding.provider=${EMBEDDING_PROVIDER:local}
app.assistant.embedding.base-url=${EMBEDDING_BASE_URL:}
app.assistant.embedding.api-key=${EMBEDDING_API_KEY:}
app.assistant.embedding.model=${EMBEDDING_MODEL:}

# Gas/smoke email alerts (MQ-2). Thresholds are raw ADC values (0-4095). Gmail SMTP with STARTTLS on 587; MAIL_PASSWORD must be a
# Google App Password (never the account password). Without MAIL_USERNAME/MAIL_PASSWORD incidents are still recorded, just not mailed.
app.alerts.enabled=${ALERT_GAS_ENABLED:true}
app.alerts.gas-threshold=${ALERT_GAS_THRESHOLD:2500}
app.alerts.recovery-margin-percent=${ALERT_GAS_RECOVERY_MARGIN_PERCENT:15}
app.alerts.confirm-readings=${ALERT_GAS_CONFIRM_READINGS:2}
app.alerts.mail-from=${ALERT_MAIL_FROM:}
# Away-mode motion emails (one per motion episode), the dashboard address used by the email buttons, and the time zone
# for times shown in emails (blank = the server's zone).
app.alerts.motion-email-enabled=${ALERT_MOTION_EMAIL_ENABLED:true}
app.alerts.dashboard-url=${ALERT_DASHBOARD_URL:http://localhost:5174}
app.alerts.time-zone=${ALERT_TIME_ZONE:}
# Anomaly emails: one per anomaly at or above the minimum severity (INFO, WARNING, CRITICAL), and the same problem on the
# same device is not emailed again within the cooldown. Uses the same Gmail account as gas and motion alerts.
app.alerts.anomaly.email-enabled=${ALERT_ANOMALY_EMAIL_ENABLED:true}
app.alerts.anomaly.email-min-severity=${ALERT_ANOMALY_EMAIL_MIN_SEVERITY:WARNING}
app.alerts.anomaly.email-cooldown-minutes=${ALERT_ANOMALY_EMAIL_COOLDOWN_MINUTES:60}
# Mail transport: "smtp" (default, Gmail above) or "brevo" (HTTPS API, for hosts that block outbound SMTP).
app.mail.provider=${MAIL_PROVIDER:smtp}
app.mail.brevo.api-key=${BREVO_API_KEY:}
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
