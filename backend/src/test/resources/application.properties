spring.application.name=smarthome-backend
spring.config.import=
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration,classpath:db/vendor/{vendor}
# The offline sweep is effectively off in tests; they call SecurityService.sweepOffline() directly.
app.security.sweep-ms=3600000
# Assistant: no real language model in tests (they plug in a scripted fake); the built-in local embedder is used.
app.assistant.llm.provider=none
app.assistant.embedding.provider=local
app.assistant.rag.refresh-seconds=0
app.assistant.chat.requests-per-minute=1000
spring.jpa.hibernate.ddl-auto=validate
# Test-only throwaway secret, not used anywhere else.
app.jwt.secret=test-only-secret-test-only-secret-1234567890
app.jwt.expiration-minutes=60
app.cors.allowed-origins=http://localhost:5173
spring.jpa.open-in-view=false
app.mqtt.enabled=false
# The scheduled sweeper is effectively off in tests; tests call CommandService.sweep() explicitly.
app.commands.sweep-ms=3600000
app.commands.ttl-seconds=30
app.commands.unknown-grace-seconds=10
app.telemetry.stale-after-seconds=90
# Scheduler effectively off in tests; they call AutomationEngine.runDueSchedules(instant) with chosen times.
app.automation.schedule-tick-ms=3600000
# ML background jobs are effectively off in tests; they call the services directly.
app.ml.anomaly.scan-ms=3600000
app.ml.training.auto-check-ms=3600000
app.ml.training.min-manual-interval-seconds=1
app.ml.anomaly.min-manual-scan-interval-seconds=3

# Recommendations are regenerated on every request in tests.
app.recommendations.auto-refresh-seconds=0
app.recommendations.min-manual-refresh-seconds=0

# Gas alerts: explicit so the tests do not depend on the defaults.
app.alerts.enabled=true
app.alerts.gas-threshold=2500
app.alerts.recovery-margin-percent=15
app.alerts.confirm-readings=2
app.alerts.dashboard-url=http://localhost:5174
app.alerts.time-zone=UTC
