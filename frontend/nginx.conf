server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Same-origin API: the browser talks only to this server, which forwards /api to the backend container.
    location /api/ {
        # Resolve "backend" through Docker's DNS on every request (cached 10s) instead of once at startup, so
        # rebuilding/recreating only the backend container (new IP) can't leave nginx stuck returning 502.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend_upstream http://backend:8081;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # React Router: unknown paths fall back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
