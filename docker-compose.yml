services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: smarthome-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-smarthome}
      POSTGRES_USER: ${POSTGRES_USER:-smarthome}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env and set POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Scripts here run once, on first start of an empty data volume.
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: creates the broker's Dynamic Security file with the admin account, only if it doesn't exist yet.
  # (Changing MQTT_ADMIN_* later has no effect on an existing volume: run `docker compose down -v` to reset.)
  mosquitto-init:
    image: eclipse-mosquitto:2
    container_name: smarthome-mosquitto-init
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if [ ! -f /mosquitto/data/dynamic-security.json ]; then
          mosquitto_ctrl dynsec init /mosquitto/data/dynamic-security.json "$$MQTT_ADMIN_USER" "$$MQTT_ADMIN_PASSWORD"
        fi
        chown -R mosquitto:mosquitto /mosquitto/data
    environment:
      MQTT_ADMIN_USER: ${MQTT_ADMIN_USER:-smarthome-admin}
      MQTT_ADMIN_PASSWORD: ${MQTT_ADMIN_PASSWORD:?Set MQTT_ADMIN_PASSWORD in .env}
    volumes:
      - mosquitto_data:/mosquitto/data
    restart: "no"

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: smarthome-mosquitto
    depends_on:
      mosquitto-init:
        condition: service_completed_successfully
    ports:
      - "${MQTT_PORT:-1883}:1883"
    volumes:
      - ./infra/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_data:/mosquitto/data
    healthcheck:
      # Anonymous access is off, so only check that the listener accepts connections.
      test: ["CMD-SHELL", "nc -z localhost 1883 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    container_name: smarthome-backend
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
    # Everything in .env (secrets, JWT, LLM_*, ...) is passed through; the values below override the
    # host-side ones, which are published ports and mean something different inside the compose network.
    env_file: .env
    environment:
      SERVER_PORT: "8081"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      MQTT_HOST: mosquitto
      MQTT_PORT: "1883"
    ports:
      # Host port differs from SERVER_PORT so a backend started from the IDE (which uses SERVER_PORT) can run alongside.
      - "${BACKEND_HOST_PORT:-8082}:8081"
    restart: unless-stopped
    healthcheck:
      # /api/health is public; bash's /dev/tcp avoids needing curl in the JRE image.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8081 && printf 'GET /api/health HTTP/1.0\\r\\n\\r\\n' >&3 && head -n1 <&3 | grep -q ' 200'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  frontend:
    build: ./frontend
    container_name: smarthome-frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-5174}:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
  mosquitto_data:
