# Authentication and per-device topic permissions come from the Dynamic Security plugin.
# The SmartHome backend creates/removes one broker user per paired device (username = device ID,
# password = the credential issued at pairing) and confines it to home/devices/<its own ID>/...
# Anonymous access is OFF. Plain MQTT without TLS: for a trusted home LAN only; do not expose port 1883 publicly.
listener 1883
allow_anonymous false

plugin /usr/lib/mosquitto_dynamic_security.so
plugin_opt_config_file /mosquitto/data/dynamic-security.json

persistence true
persistence_location /mosquitto/data/
log_dest stdout
